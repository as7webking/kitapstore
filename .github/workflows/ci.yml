name: Kitapstore CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Test, lint and build for Vercel
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/safety.cjs
          VERCEL: '1'
          VITE_API_URL: https://api.example.test
        run: |
          npm test --prefix frontend
          npm run lint --prefix frontend -- --max-warnings=0
          npm run build --prefix frontend

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Check syntax and test with fake services
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/safety.cjs
          NODE_ENV: test
          APP_ENV: development
          URI: mongodb://127.0.0.1:1/kitapstore_test
          JWT_SECRET: ci-only-synthetic-secret-not-for-deployment
          FRONTEND_URL: https://shop.example.test
          EMAIL_HOST: smtp.example.test
          EMAIL_PORT: '587'
          EMAIL_USER: ci-synthetic
          EMAIL_PASS: ci-synthetic
          RATE_LIMIT_TEST_URI: ''
        run: |
          node --test scripts/ci/safety.test.cjs
          node scripts/ci/check-backend.cjs
          npm test --prefix backend

  browser:
    name: Profile address browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Install test Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test profile address with mocked APIs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/safety.cjs
        run: npm run test:browser --prefix frontend
